name: CoinSwitch Minute Watch (best effort)

on:
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read

concurrency:
  group: coinswitch-minute-scanner
  cancel-in-progress: false

jobs:
  minute-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract working v1 base and v2 Python upgrade
        run: |
          unzip -q -o CoinSwitch_Signal_Lab_v1.zip
          mkdir -p v2_overlay
          unzip -q -o CoinSwitch_Signal_Lab_v2.zip -d v2_overlay
          cp v2_overlay/coinswitch_signal_lab/*.py coinswitch_signal_lab/scanner/
      - name: Install dependencies
        run: python -m pip install -r coinswitch_signal_lab/requirements.txt
      - name: Test scanner upgrade
        working-directory: coinswitch_signal_lab
        run: |
          python -m unittest discover -s tests -q
          python -m scanner.main --demo
      - name: Scan CoinSwitch without placing orders
        working-directory: coinswitch_signal_lab
        env:
          COINSWITCH_API_KEY: ${{ secrets.COINSWITCH_API_KEY }}
          COINSWITCH_SECRET_KEY: ${{ secrets.COINSWITCH_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USDT_INR: ${{ vars.USDT_INR }}
          BALANCE_INR: ${{ vars.BALANCE_INR }}
          OBSERVED_TAKER_FEE: ${{ vars.OBSERVED_TAKER_FEE }}
          MAX_SYMBOLS: '20'
          CORE_SYMBOLS: '4'
          KLINE_BUDGET_PER_SCAN: '26'
        run: python -u -m scanner.main --watch --interval 60 --iterations 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minute-signal-report-${{ github.run_id }}
          path: |
            coinswitch_signal_lab/report.html
            coinswitch_signal_lab/last_scan.json
          if-no-files-found: ignore
          retention-days: 14
