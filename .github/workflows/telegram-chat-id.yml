
name: Telegram Chat ID Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Find Telegram Chat ID
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request

          token = os.getenv("TOKEN")
          if not token:
              raise SystemExit("Missing bot token secret")

          try:
              url = f"https://api.telegram.org/bot{token}/getUpdates"
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
          except Exception:
              raise SystemExit("Telegram request failed. Check bot token or webhook.")

          chats = set()
          for update in data.get("result", []):
              message = update.get("message", {})
              chat = message.get("chat", {})
              if "id" in chat:
                  chats.add(chat["id"])

          if not chats:
              raise SystemExit("Send /start and hello to your bot, then rerun.")

          for chat_id in sorted(chats):
              print(f"TELEGRAM_CHAT_ID = {chat_id}")
          PY
